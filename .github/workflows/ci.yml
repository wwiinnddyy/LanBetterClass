name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: build
        run: cargo build --workspace --all-targets --message-format=short

      - name: test
        run: cargo test --workspace --message-format=short

      # Linux 这一腿兼任端到端：CI 的磁盘不是约束，所以让它在真实进程模型上
      # 把"开课 → 投递 → 缺口/重启/blob → 落盘 → 导出 AI 载荷"跑一遍并断言实数。
      - name: smoke (core + adapters)
        if: matrix.os == 'ubuntu-latest'
        run: bash tools/ci-smoke.sh

      - name: artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: |
            target/debug/classagent-core
            target/debug/a-fake
            target/debug/a-audiofile
          if-no-files-found: warn
