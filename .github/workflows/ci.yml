name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # a-audio 用 cpal 取麦克风：Linux 侧的 ALSA 绑定在编译期需要系统头文件；
      # Windows 侧走纯 Rust 的 windows 绑定，runner 自带，不需要额外安装。
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: build
        run: cargo build --workspace --all-targets --message-format=short

      - name: test
        run: cargo test --workspace --message-format=short

      # 端到端守卫，两个平台各跑一遍同一份脚本：Windows 侧的子进程 spawn、管道、
      # CRLF、$TARGET_DIR 补 .exe 这些行为只有真 Windows runner 能证。
      - name: smoke (client + adapters)
        shell: bash
        run: bash tools/ci-smoke.sh

      # 客户端 → 远程服务端的 HTTP 链路：真实 push、落盘去重、AI 请求单、鉴权、路径穿越。
      - name: integration (client -> server)
        shell: bash
        run: bash tools/ci-integration.sh

      # 录音适配器：用 fixture 回放断真分段/真 blob/真导出，再断"本机没麦克风必须被标 silent"。
      - name: audio (a-audio)
        shell: bash
        run: bash tools/ci-audio.sh

      # 关键帧适配器：用 Python 手搓的 PNG 回放断变化检测/节流/真 blob，再断"静止的一节课只有一帧"。
      - name: screen (a-screen)
        shell: bash
        run: bash tools/ci-screen.sh

      - name: strip linker junk
        shell: bash
        run: rm -f target/debug/*.d

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.os }}
          path: |
            target/debug/classagent-client*
            target/debug/classagent-server*
            target/debug/a-fake*
            target/debug/a-audiofile*
            target/debug/a-audio*
            target/debug/a-screen*
          if-no-files-found: warn
