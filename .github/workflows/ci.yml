name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: build
        run: cargo build --workspace --all-targets --message-format=short

      - name: test
        run: cargo test --workspace --message-format=short

      # 端到端守卫，两个平台各跑一遍同一份脚本：Windows 侧的子进程 spawn、管道、
      # CRLF、$TARGET_DIR 补 .exe 这些行为只有真 Windows runner 能证。
      - name: smoke (core + adapters)
        shell: bash
        run: bash tools/ci-smoke.sh

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.os }}
          path: |
            target/debug/classagent-core*
            target/debug/a-fake*
            target/debug/a-audiofile*
          if-no-files-found: warn
